name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The JAR only; the unit tests run in test.yml.
      - name: Build the mod
        run: ./gradlew assemble --no-daemon

      - name: Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: teyvatcartographia-jar
          path: build/libs/*.jar
